<form class="form" novalidate (submit)="$event.preventDefault(); go()"><h2>Change password</h2>
  <label>Current password</label><input type="password" [formField]="f.currentPassword"><app-field-errors [field]="f.currentPassword" />
  <label>New password</label><input type="password" [formField]="f.password"><app-field-errors [field]="f.password" />
  <label>Confirm new password</label><input type="password" [formField]="f.rePassword"><app-field-errors [field]="f.rePassword" />
  <div class="err">{{ err() }}</div><button class="btn" [disabled]="f().invalid() || busy()">Update password</button></form>
